{% extends 'admin/base.html' %}
{% block title %}關於我{% endblock %}
{% block content %}
<div class="topbar"><h2>🧬 關於我編輯</h2></div>
<div class="panel"><form method="post">
<label>姓名</label><input name="name" value="{{ about.name if about else '' }}">
<label>職稱</label><input name="title" value="{{ about.title if about else '' }}">
<label>副標</label><input name="subtitle" value="{{ about.subtitle if about else '' }}">
<label>自我介紹</label><textarea name="description" rows="6">{{ about.description if about else '' }}</textarea>
<label>技能(逗號分隔)</label><input name="skills" value="{{ about.skills if about else '' }}">
<label>大頭貼URL</label><input name="avatar_url" value="{{ about.avatar_url if about else '' }}">
<label>Email</label><input name="email" value="{{ about.email if about else '' }}">
<label>電話</label><input name="phone" value="{{ about.phone if about else '' }}">
<label>地點</label><input name="location" value="{{ about.location if about else '' }}">
<button class="btn" type="submit">儲存更新</button>
</form></div>
{% endblock %}
