<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}後台{% endblock %}｜ALAN ADMIN</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="layout">
<aside class="side">
<h2>⚡ <b>ALAN ADMIN</b></h2>
<div style="color:var(--muted);font-size:.85rem;margin-bottom:1rem">👤 {{ admin_nickname }}・<a href="{{ url_for('admin_logout') }}">登出</a></div>
<a class="item {% if active=='dashboard' %}on{% endif %}" href="{{ url_for('admin_dashboard') }}">📊 儀表板</a>
<a class="item {% if active=='about' %}on{% endif %}" href="{{ url_for('admin_about') }}">🧬 關於我</a>
<a class="item {% if active=='works' %}on{% endif %}" href="{{ url_for('admin_works') }}">🚀 作品分享</a>
<a class="item {% if active=='messages' %}on{% endif %}" href="{{ url_for('admin_messages') }}">📡 聯絡我留言</a>
<a class="item {% if active=='admins' %}on{% endif %}" href="{{ url_for('admin_admins') }}">🛡️ 後台管理員管理</a>
<a class="item" href="{{ url_for('index') }}" target="_blank">🌐 預覽前台</a>
</aside>
<div class="main">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for c,m in messages %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</div>
</div>
</body></html>
